# ConfigMap -- honcho-config
#
# Non-sensitive Honcho configuration shared by BOTH the API and Deriver
# deployments. Both pods mount the same ConfigMap via envFrom.
#
# DERIVER_ENABLED is intentionally NOT here -- it has different values per
# deployment (false for API, true for Deriver) and is set in each Deployment
# manifest's env block instead.
#
# Sensitive values (DB_CONNECTION_URI, LLM_OPENAI_API_KEY, AUTH_JWT_SECRET)
# live in sealedsecret-honcho.yaml and are injected as env vars in each
# Deployment's env block via secretKeyRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honcho-config
  namespace: honcho
data:
  # --- Auth ---
  # Enable JWT authentication for the Honcho API. ALWAYS enabled -- security
  # is a core pillar. Hermes provides its API key via HONCHO_API_KEY env var.
  AUTH_USE_AUTH: "true"

  # --- Cache ---
  # Valkey for session caching. Cache state is ephemeral; durable state
  # lives in Postgres. No authentication -- network-level isolation via
  # the Valkey NetworkPolicy restricts access to honcho namespace pods.
  CACHE_ENABLED: "true"
  CACHE_URL: "redis://honcho-valkey.honcho.svc.cluster.local:6379/0?suppress=true"

  # --- LLM ---
  # Point at the LiteLLM proxy for OpenAI-compatible access to all upstream models.
  # Honcho's LLM calls (deriver, dialectic, summary, dream) route through here.
  # Uses the secure external domain (HTTPS via Traefik) rather than the
  # cluster-internal HTTP endpoint.
  LLM_OPENAI_BASE_URL: "https://litellm.diceninjagaming.com/v1"

  # --- Default module models ---
  # Honcho hardcodes gpt-5.4-mini as the default model for every module
  # without an explicit model config (src/config.py _MODEL_CONFIG_DEFAULT
  # factories) — a model name our LiteLLM handler does not route. There is
  # NO global default-model setting: LLMSettings has no MODEL field and
  # silently ignores unknown LLM_* env vars, so each module needs its own
  # override. Dialectic levels and dream deduction/induction are overridden
  # below and in the Deriver manifest; these two cover the remaining
  # modules that were running the gpt-5.4-mini default.
  # No OVERRIDES__BASE_URL needed: modules without a base_url override ride
  # the default OpenAI client, which reads LLM_OPENAI_BASE_URL above
  # (src/llm/registry.py client_for_model_config).
  # Deriver extraction (conclusion derivation) — core memory pipeline.
  DERIVER_MODEL_CONFIG__MODEL: "anthropic/smart"
  # Session summaries — bulk background work, cost-effective model.
  SUMMARY_MODEL_CONFIG__MODEL: "anthropic/cheap"

  # --- Embedding ---
  # Resolved: openai/text-embedding-3-small via LiteLLM, 1536 dimensions.
  # These are IMMUTABLE after first deployment -- changing requires a full
  # database schema migration and re-embedding of all stored documents.
  EMBEDDING_MODEL_CONFIG__TRANSPORT: "openai"
  EMBEDDING_MODEL_CONFIG__MODEL: "text-embedding-3-small"
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"
  EMBEDDING_VECTOR_DIMENSIONS: "1536"

  # --- Dialectic ---
  # Honcho's dialectic feature defaults to gpt-5.4-mini hitting OpenAI
  # directly. Override all levels to route through LiteLLM. Lower levels
  # (minimal, low) use the cost-effective model; higher levels (medium,
  # high, max) use the flagship model for deeper reasoning quality.
  # Dream models are configured separately in the Deriver manifest.
  DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL: "anthropic/cheap"
  DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"
  DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL: "anthropic/cheap"
  DIALECTIC_LEVELS__LOW__MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"
  DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL: "anthropic/smart"
  DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"
  DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL: "anthropic/smart"
  DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"
  DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL: "anthropic/smart"
  DIALECTIC_LEVELS__MAX__MODEL_CONFIG__OVERRIDES__BASE_URL: "https://litellm.diceninjagaming.com/v1"

  # --- Telemetry ---
  # Don't phone home -- this is a homelab, not a SaaS deployment.
  TELEMETRY_ENABLED: "false"

  # --- Metrics ---
  METRICS_ENABLED: "true"
