apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    litellm_settings:
      # Drop unknown/unsupported parameters instead of returning a 400. Needed
      # because OpenAI-native clients often send fields NVIDIA NIM ignores.
      drop_params: true

      # Intercept requests where the model signals web-search intent and
      # fulfil them via the configured search tool before the final completion.
      #
      # SYNTAX NOTE (v1.83.10): options MUST live under callback_settings, not
      # nested inside the callbacks list — nesting causes a startup crash.
      callbacks:
        - websearch_interception

      callback_settings:
        websearch_interception:
          search_tool_name: searxng-diceninjagaming
          # enabled_providers MUST be listed explicitly. Omitting this field
          # does NOT enable all providers — the code defaults to Bedrock only,
          # despite the docstring claiming otherwise. Verified in:
          # litellm/integrations/websearch_interception/handler.py __init__:
          #   if enabled_providers is None:
          #       self.enabled_providers = [LlmProviders.BEDROCK.value]
          # Provider string reference: docs.litellm.ai/docs/providers
          # The string matches each provider's URL slug on that page.
          enabled_providers:
            - cerebras
            - cohere
            - gemini
            - groq
            - nvidia_nim
            - openrouter
          #
          # nvidia_nim was previously excluded: NIM model IDs contain an
          # org/model slash that made handler.py drop the provider prefix on
          # the follow-up completion call ("LLM Provider NOT provided",
          # github.com/BerriAI/litellm/issues/23970). Fixed in LiteLLM
          # v1.109.0 (PR #38885 keeps the provider prefix on the agentic
          # follow-up model); re-added here as part of the v1.110.2 upgrade.

    general_settings:
      # Anthropic "dangerous_tool_use" safeguard classifier. Must live under
      # general_settings — litellm_settings ignores it. Value is the public
      # model_name as served by this proxy. Sub-call bills the caller's API
      # key: keys without access to this model skip the check (warning in logs).
      safeguards_classifier_model: anthropic/cheap

    search_tools:
      - search_tool_name: searxng-diceninjagaming
        litellm_params:
          search_provider: searxng
          api_base: https://searxng.diceninjagaming.com
