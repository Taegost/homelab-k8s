# Deployment — Bazarr
#
# Bazarr is a subtitle management and download automation tool that works
# alongside Sonarr and Radarr to fetch and sync subtitles for your library.
# GitHub: https://github.com/morpheus65535/bazarr
#
# Volumes:
#   /config     — Longhorn PVC (bazarr-config): app configuration, subtitle
#                 provider credentials, sync settings, SQLite database.
#   /multimedia — Shared NFS PVC (multimedia): all four arr-stack media apps
#                 mount this single RWX PVC simultaneously. It binds to the
#                 static PV arr-stack-multimedia which points directly at the
#                 Multimedia share root — Bazarr needs this to write subtitle
#                 files alongside media managed by Sonarr and Radarr.
#   /backups    — NFS PVC (bazarr-backups): dynamically provisioned on the
#                 Unraid Backups share via nfs-backups StorageClass. Data lives
#                 at /mnt/user/Backups/arr-stack/bazarr-backups/ on Unraid.
#
# Image versioning: pinned to a specific tag for reproducible deployments.
# To upgrade: update the image tag below and push — ArgoCD applies the change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: arr-stack
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Longhorn PVCs mount owned by root. fsGroup causes Kubernetes to
        # chown the volume to this GID on mount so the node user can write to it
        fsGroup: 100
      containers:
        - name: bazarr
          # Pinned to latest because trying to find the actual latest tag is a pain
          image: lscr.io/linuxserver/bazarr:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          ports:
            - containerPort: 6767
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "000"
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: multimedia
              mountPath: /multimedia
            - name: backups
              mountPath: /backups
          # Probe design: Bazarr's startup library scan (subtitle sync over the
          # multimedia SMB mount, ~106 worker threads) starves the Python GIL so
          # the HTTP event loop cannot answer requests mid-scan — sometimes for
          # 10+ minutes with cache=none on the mount. Without a startupProbe the
          # liveness probe killed the container at exactly 120s (30s delay +
          # 3 × 30s failures at 1s timeout), restarting the scan from zero:
          # infinite crash loop. startupProbe suspends liveness/readiness until
          # it passes, giving the scan 30 min (10s × 180) to finish. After the
          # first success, normal probes take over and the app serves normally.
          startupProbe:
            httpGet:
              path: /api/system/ping
              port: 6767
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /api/system/ping
              port: 6767
            timeoutSeconds: 3
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          # timeoutSeconds 3 (not the 1s default): under GIL contention the
          # event loop can take >1s to answer even when healthy — 1s produced
          # false "awaiting headers" failures.
          livenessProbe:
            httpGet:
              path: /api/system/ping
              port: 6767
            timeoutSeconds: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: multimedia
          persistentVolumeClaim:
            claimName: multimedia
        - name: backups
          persistentVolumeClaim:
            claimName: bazarr-backups
